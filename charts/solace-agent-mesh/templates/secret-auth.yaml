{{- if or (not .Values.sam.communityMode) (eq (.Values.sam.platform | default "python") "go") }}
{{ include "sam.secret.metadata" (dict "root" . "name" "auth-secrets" "component" "auth") }}
data:
  OIDC_ISSUER: {{ .Values.sam.oauthProvider.oidc.issuer | b64enc | quote }}
  OIDC_CLIENT_ID: {{ .Values.sam.oauthProvider.oidc.clientId | b64enc | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.sam.oauthProvider.oidc.clientSecret | b64enc | quote }}
  {{- $urls := include "sam.urls.compute" . | fromYaml }}
  OIDC_REDIRECT_URI: {{ $urls.authCallbackUrl | b64enc | quote }}
  {{- if eq (.Values.sam.platform | default "python") "go" }}
  # OAUTH_TOOL_REDIRECT_URI is the callback URL the Go agent runtime (cmd/awe)
  # hands to a tool's OAuth provider on interactive consent (Atlassian Rovo
  # MCP, etc.). Read at internal/auth/toolauth/oauth2.go:276; without it the
  # runtime falls back to http://localhost:8000/api/v1/auth/tool/callback and
  # the IdP shows an unusable consent screen with a localhost redirect.
  OAUTH_TOOL_REDIRECT_URI: {{ $urls.toolCallbackUrl | b64enc | quote }}
  {{- end }}
{{- end }}
